apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  labels:
    app: outline
spec:
  replicas: 1
  # Default RollingUpdate keeps the old pod alive as a safety net whenever
  # the new one isn't healthy yet - sensible for production, but it breaks
  # this test's isolation: with replicas=1, run-matrix.sh patches resources
  # between combos, and if a resource-starved combo's pod never becomes
  # Ready, the PREVIOUS combo's (healthier) pod keeps serving traffic
  # alongside it via the Service, silently contaminating results with
  # requests that never hit the tier actually under test. Recreate forces
  # the old pod to fully terminate before the new one starts, guaranteeing
  # exactly one pod (the one being tested) exists at any time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outline
  template:
    metadata:
      labels:
        app: outline
    spec:
      containers:
        - name: outline
          image: outlinewiki/outline:1.9.1
          envFrom:
            - secretRef:
                name: outline-env
          # Task 8 smoke test (768Mi/1000m) showed a 37.7% error rate that was
          # NOT resource starvation: curl testing confirmed Outline's built-in
          # API rate limiter (RateLimit-Limit: 100 header) was throttling all
          # 15 k6 VUs sharing one token, which would make err_rate constant
          # (and useless for distinguishing resource combinations) across the
          # whole Task 9 matrix. Disabled for this disposable test cluster
          # only, with explicit user approval, so the load test measures
          # actual CPU/memory-driven behavior instead of an artificial throttle.
          env:
            - name: RATE_LIMITER_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: outline
spec:
  type: NodePort
  selector:
    app: outline
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
